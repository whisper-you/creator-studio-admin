name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: 类型检查
        run: pnpm exec tsc -b

      - name: 构建
        run: pnpm build

      - name: 后端集成测试(node + sqlite)
        run: pnpm test:server

      - name: 安装浏览器测试依赖
        run: pnpm exec playwright install --with-deps chromium

      - name: 前端单元测试(vitest browser)
        run: pnpm test
