services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - sqlite-data:/app/server/data
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  sqlite-data:
  uploads-data:
